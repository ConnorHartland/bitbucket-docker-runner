schemaVersion: 1.0
phases:
  - name: build
    steps:
      - name: InstallNftables
        action: ExecuteBash
        inputs:
          commands:
            - dnf install -y nftables

      - name: DownloadFirewallConfig
        action: ExecuteBash
        inputs:
          commands:
            - aws s3 cp s3://${golden_image_bucket}/al2023/scripts/nftables.conf /etc/nftables.conf
            - chmod 600 /etc/nftables.conf

      - name: DownloadUpdateScript
        action: ExecuteBash
        inputs:
          commands:
            - aws s3 cp s3://${golden_image_bucket}/al2023/scripts/UpdateNFTables.sh /usr/local/bin/UpdateNFTables.sh
            - chmod 755 /usr/local/bin/UpdateNFTables.sh

      - name: RunUpdateScript
        action: ExecuteBash
        inputs:
          commands:
            - /usr/local/bin/UpdateNFTables.sh

      - name: EnableNftables
        action: ExecuteBash
        inputs:
          commands:
            - systemctl enable nftables
