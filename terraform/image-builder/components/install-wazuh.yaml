schemaVersion: 1.0
phases:
  - name: build
    steps:
      - name: DownloadWazuhAgent
        action: S3Download
        inputs:
          - source: s3://goldenimage-poc/wazuh-agent.rpm
            destination: /tmp/wazuh-agent.rpm

      - name: InstallWazuhAgent
        action: ExecuteBash
        inputs:
          commands:
            - dnf install -y /tmp/wazuh-agent.rpm
            - rm -f /tmp/wazuh-agent.rpm
            - systemctl daemon-reload
            - systemctl enable wazuh-agent
